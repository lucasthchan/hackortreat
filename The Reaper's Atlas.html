<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Reaper’s Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Karla:wght@400;700&display=swap">
<style>
:root{--bg:#07040c;--panel:rgba(30,16,44,.92);--ink:#efe6d2;--mute:#b3a3c6;--line:#4a2e68;--wax:#f2c14e;--berry:#e0587a;--on:#1b1024;--serif:"IM Fell English",Georgia,serif;--sans:Karla,system-ui,sans-serif;box-sizing:border-box}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--panel:rgba(250,244,230,.95);--ink:#2a1637;--mute:#6d5a80;--line:#cdbd9c;--wax:#8a5c00;--berry:#b8284d;--on:#fff}}
:root[data-theme="dark"]{--panel:rgba(30,16,44,.92);--ink:#efe6d2;--mute:#b3a3c6;--line:#4a2e68;--wax:#f2c14e;--berry:#e0587a;--on:#1b1024}
*,*::before,*::after{box-sizing:inherit}[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}body{background:var(--bg);font:400 16px/1.45 var(--sans);color:#efe6d2}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.head{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;max-width:min(330px,50vw);pointer-events:none;text-shadow:0 1px 8px #000}
h1{font:italic 400 clamp(1.7rem,5vw,2.6rem)/1.05 var(--serif);margin:0 0 6px}.head p{margin:0 0 6px;font-size:.9rem;color:#c9bbdb}#cnt{font-weight:700;color:var(--wax)}
.people{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:12px;width:min(260px,46vw);max-height:48vh;display:flex;flex-direction:column;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
h2{font:400 1.25rem var(--serif);margin:0 0 6px}ul{list-style:none;margin:0;padding:0;overflow:auto}
.people input{font:inherit;width:100%;padding:7px 10px;margin-bottom:6px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.people li button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);border-radius:0;background:none;padding:7px 2px;font-weight:400;font-size:.88rem}
.people li small{color:var(--mute);display:block}
.foot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding:0 12px;text-align:center}
#msg{margin:0 auto 10px;max-width:60ch;text-shadow:0 1px 8px #000;min-height:1.4em}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
button{font:700 15px var(--sans);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 15px;cursor:pointer}
button.primary,button.on{background:var(--wax);color:var(--on);border-color:var(--wax)}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--wax);outline-offset:2px}
.pill{display:flex;align-items:center;gap:8px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-size:.9rem}.pill input{width:min(34vw,170px);accent-color:var(--wax)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:18px;max-width:420px;width:100%;text-align:center}
.note{color:var(--mute);font-size:.92rem;margin:0 0 10px}#dc{width:min(80vw,340px);height:auto;border-radius:16px;background:#12081c;touch-action:none;cursor:crosshair;display:block;margin:0 auto 8px}
#perr{color:var(--berry);min-height:1.3em;margin:0 0 8px;font-size:.9rem}.shelf{margin-bottom:10px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#end{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);text-align:center;padding:0 12px;text-shadow:0 1px 8px #000;color:#efe6d2}
#end p{font:italic 1.5rem var(--serif);margin:0 0 10px}
</style></head><body>
<canvas id="gl" role="img" aria-label="Globe of settlements. Drag to rotate, tap a glowing dot to choose a person."></canvas>
<div class="head"><h1>The Reaper’s Atlas</h1><p>Pick a person in the dark, draw the tool, watch the fate unfold. All people are fictional.</p><p id="cnt"></p></div>
<aside class="people"><h2>In the dark</h2><input id="q" type="search" placeholder="Search name, job or town" aria-label="Search people"><ul id="pl"></ul></aside>
<div class="foot"><p id="msg" role="status"></p><div class="row">
<button id="rand" class="primary">Random fate</button>
<label class="pill">Sun clock <input type="range" id="off" min="-12" max="12" step="0.25" value="0" aria-label="Shift the sun clock in hours"> <output id="utc"></output></label>
<button id="now">Reset to now</button></div></div>

<div class="modal" id="info" hidden><div class="card" role="dialog" aria-label="Person"><h2 id="pn"></h2><p class="note" id="pm"></p><p id="pb"></p><p class="note" id="ps"></p>
<div class="row"><button id="mk">Mark</button><button id="dr" class="primary">Draw the tool</button><button id="rp">Replay</button><button id="ci">Close</button></div></div></div>

<div class="modal" id="pad" hidden><div class="card" role="dialog" aria-label="Draw the tool"><h2 id="pt">Draw the tool</h2><p class="note">Sketch anything: a dagger, a storm, a flame, a bottle. Claude reads your drawing and picks the closest tool. Or choose one below.</p>
<canvas id="dc" width="340" height="340" aria-label="Drawing pad"></canvas><p id="perr" role="alert"></p>
<div class="row shelf" id="shelf"></div>
<div class="row"><button id="undo">Undo</button><button id="clr">Clear</button><button id="go" class="primary">Unleash</button><button id="cx">Cancel</button></div></div></div>

<div id="flash"></div><div id="end" hidden><p id="et"></p><button id="back" class="primary">Return to the world</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R=Math,PI=R.PI,D=PI/180,$=id=>document.getElementById(id),V=(x,y,z)=>new THREE.Vector3(x,y,z),rnd=(a,b)=>a+R.random()*(b-a);
const ll2v=(lat,lon)=>{const ph=(lon+180)*D,th=(90-lat)*D;return V(-R.cos(ph)*R.sin(th),R.cos(th),R.sin(ph)*R.sin(th))};
const fmt=(lat,lon)=>R.abs(lat).toFixed(1)+"°"+(lat>=0?"N":"S")+" "+R.abs(lon).toFixed(1)+"°"+(lon>=0?"E":"W");
function h3(x,y,z){const n=R.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return n-R.floor(n)}
function vn(x,y,z){const xi=R.floor(x),yi=R.floor(y),zi=R.floor(z),s=t=>t*t*(3-2*t),u=s(x-xi),v=s(y-yi),w=s(z-zi);let r=0;
 for(let a=0;a<2;a++)for(let b=0;b<2;b++)for(let c=0;c<2;c++)r+=h3(xi+a,yi+b,zi+c)*(a?u:1-u)*(b?v:1-v)*(c?w:1-w);return r}
function fbm(x,y,z){let a=.5,f=1,s=0;for(let i=0;i<5;i++){s+=a*vn(x*f,y*f,z*f);f*=2;a*=.5}return s}
const land=(lat,lon)=>{const v=ll2v(lat,lon);return R.abs(lat)<60&&fbm(v.x*2.2+5,v.y*2.2+5,v.z*2.2+5)>.55};
function makeTex(){const W=512,H=256,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d"),im=x.createImageData(W,H);
 for(let j=0;j<H;j++)for(let i=0;i<W;i++){const lat=90-(j+.5)/H*180,lon=(i+.5)/W*360-180,v=ll2v(lat,lon),n=fbm(v.x*2.2+5,v.y*2.2+5,v.z*2.2+5),k=(j*W+i)*4;let r,g,b;
  if(R.abs(lat)>73){r=205;g=212;b=232}else if(n>.53){const t=(n-.5)*200;r=70+t;g=58+t*.8;b=96+t*.6}else{r=12;g=14;b=46+n*30}
  im.data[k]=r;im.data[k+1]=g;im.data[k+2]=b;im.data[k+3]=255}x.putImageData(im,0,0);return new THREE.CanvasTexture(c)}

/* ---------- people database (fictional, seeded, saved status in localStorage) ---------- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rr=rng(1313),pick=a=>a[R.floor(rr()*a.length)];
const FN="Ada Bram Cleo Dov Edda Finn Gwen Hugo Ines Jory Kira Lev Mara Nico Orla Pip Quin Rhea Sven Tess Uma Vik Wren Yara".split(" "),
LN="Ashby Blythe Crane Dunmore Ellery Fenwick Gray Holloway Ives Kestrel Lark Marsh Nightingale Orme Pryce Quill Rook Sable Thorne Vale Wick Yew Zeal Moor".split(" "),
JOB="baker,clockmaker,nurse,ferry pilot,teacher,beekeeper,courier,tailor,mechanic,lamplighter,librarian,fisher,brewer,gardener,painter,farmer".split(","),
HOB="hums on the walk home,collects odd buttons,never misses market day,feeds the stray cats,writes letters nobody sends,grows enormous pumpkins,whistles off-key,keeps a diary of the weather".split(","),
TOWN="Hollowmere,Ashgrove,Duskwick,Mournhaven,Gloamton,Thistledown,Ravenscar,Lanternfall,Pale Harbor,Cinderford,Wispmoor,Greywater,Bellhollow,Murkdale".split(","),
SKIN=[0xf1c7a5,0xd9a27a,0xb87a52,0x8a5638,0x5e3a26,0xf6d6bd],HAIR=[0x1a1210,0x4a2c17,0x8a5a2a,0xc9a14a,0xb5b5b5,0x7a2a1a],CL=[0x3a5a8a,0x7a2a4a,0x2f6a4a,0xb06a2a,0x5a4a8a,0x8a8a3a,0x2a2a3a,0xa04040];
const TOWNS=[];for(let t=0;t<TOWN.length;t++){for(let i=0;i<500;i++){const lat=rnd2(-55,60),lon=rnd2(-180,180);if(land(lat,lon)){TOWNS.push({n:TOWN[t],lat,lon});break}}}
function rnd2(a,b){return a+rr()*(b-a)}
const P=[];for(let i=0;i<140&&TOWNS.length;i++){const t=pick(TOWNS),fn=pick(FN),job=pick(JOB);
 P.push({id:i,name:fn+" "+pick(LN),age:18+R.floor(rr()*62),job,town:t.n,lat:t.lat+rnd2(-1.6,1.6),lon:t.lon+rnd2(-1.6,1.6),skin:pick(SKIN),hair:pick(HAIR),hs:R.floor(rr()*3),shirt:pick(CL),pants:pick(CL),h:.9+rr()*.2,w:.85+rr()*.35,
 bio:"Works as a "+job+" in "+t.n+" and "+pick(HOB)+"."});P[i].v=ll2v(P[i].lat,P[i].lon)}
let S={};try{S=JSON.parse(localStorage.getItem("reaper-atlas-2")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("reaper-atlas-2",JSON.stringify(S))}catch(e){}};
const st=p=>(S[p.id]&&S[p.id].s)||"alive";

/* ---------- globe ---------- */
const cv=$("gl"),renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});renderer.setPixelRatio(R.min(devicePixelRatio,2));
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1,.05,100);camera.position.set(0,0,3.4);
const cscene=new THREE.Scene(),ccam=new THREE.PerspectiveCamera(45,1,.1,100);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=ccam.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();ccam.updateProjectionMatrix()}addEventListener("resize",resize);resize();
const globe=new THREE.Group();scene.add(globe);const U={map:{value:makeTex()},sun:{value:V(1,0,0)}};
const sphere=new THREE.Mesh(new THREE.SphereGeometry(1,96,64),new THREE.ShaderMaterial({uniforms:U,
 vertexShader:"varying vec2 vUv;varying vec3 vP;void main(){vUv=uv;vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
 fragmentShader:`uniform sampler2D map;uniform vec3 sun;varying vec2 vUv;varying vec3 vP;
 void main(){vec3 t=texture2D(map,vUv).rgb;float d=dot(normalize(vP),sun);float day=smoothstep(-.06,.1,d);
 vec3 night=t*vec3(.6,.5,1.)+vec3(0.,0.,.03);vec3 dc=vec3(dot(t,vec3(.33)))*vec3(1.,.9,.7)*1.9+vec3(.18,.12,.02);dc*=.8+.2*step(.5,fract((vUv.x+vUv.y)*140.));
 vec3 col=mix(night,dc,day);col+=vec3(.9,.3,.5)*exp(-abs(d)*40.)*.35;gl_FragColor=vec4(col,1.);}`}));globe.add(sphere);
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.12,64,48),new THREE.ShaderMaterial({side:THREE.BackSide,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 vertexShader:"varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
 fragmentShader:"varying vec3 vN;void main(){float i=pow(clamp(-dot(vN,vec3(0.,0.,1.))*2.2,0.,1.),2.)*.7;gl_FragColor=vec4(.5,.3,.9,1.)*i;}"})));
function stars(sc){const a=[];for(let i=0;i<700;i++){const v=V(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize().multiplyScalar(40);a.push(v.x,v.y,v.z)}
 const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(a,3));sc.add(new THREE.Points(g,new THREE.PointsMaterial({size:.12,color:0xcfc4e6})))}stars(scene);stars(cscene);
const dGeo=new THREE.SphereGeometry(.012,8,6),dots=P.map(p=>{const m=new THREE.Mesh(dGeo,new THREE.MeshBasicMaterial());m.position.copy(p.v).multiplyScalar(1.006);m.userData=p;globe.add(m);return m});
const ring=new THREE.Mesh(new THREE.RingGeometry(.022,.03,32),new THREE.MeshBasicMaterial({color:0xefe6d2,side:THREE.DoubleSide}));ring.visible=false;globe.add(ring);

let off=0;function sunVec(){const t=new Date(Date.now()+off*36e5),h=t.getUTCHours()+t.getUTCMinutes()/60,doy=(t-Date.UTC(t.getUTCFullYear(),0,0))/864e5;return ll2v(23.44*R.sin(2*PI*(doy-81)/365),-(h-12)*15)}
const isNight=p=>p.v.dot(sunVec())<0,say=t=>{$("msg").textContent=t},IDLE="Drag to turn the world. Tap a glowing dot to choose someone in the dark.";say(IDLE);
function paint(){let a=0,m=0,t=0;P.forEach((p,i)=>{const s=st(p),n=isNight(p),d=dots[i];s=="taken"?t++:s=="marked"?m++:a++;
 d.material.color.set(s=="taken"?0x6a3a9a:!n?0x4a4458:s=="marked"?0xe0587a:0xf2c14e);d.scale.setScalar(s=="marked"&&n?1.7:n?1.2:.8)});
 $("cnt").textContent=a+" alive, "+m+" marked, "+t+" taken"}
function renderList(){const q=$("q").value.toLowerCase(),u=$("pl");u.innerHTML="";let n=0;
 P.filter(p=>isNight(p)&&st(p)!="taken"&&(p.name+p.job+p.town).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name)).slice(0,60).forEach(p=>{
  const li=document.createElement("li"),b=document.createElement("button"),s=document.createElement("small");b.textContent=p.name+(st(p)=="marked"?" (marked)":"");s.textContent=p.job+", "+p.town;b.append(s);b.onclick=()=>{if(!busy){select(p);face(p.v)}};li.append(b);u.append(li);n++});
 if(!n)u.innerHTML="<li class='note'>No one matches in the dark.</li>"}
$("q").oninput=renderList;

/* ---------- animation helpers ---------- */
const anims=[],ease=k=>k<.5?2*k*k:1-R.pow(-2*k+2,2)/2;
const anim=(d,fn)=>new Promise(res=>anims.push({t0:performance.now(),d:d*1000,fn,res}));
function step(now){for(let i=anims.length-1;i>=0;i--){const a=anims[i],k=R.min(1,(now-a.t0)/a.d);a.fn(k);if(k>=1){anims.splice(i,1);a.res()}}}
async function face(v){const q0=globe.quaternion.clone(),q1=new THREE.Quaternion().setFromUnitVectors(v,V(0,0,1));await anim(.9,k=>globe.quaternion.copy(q0).slerp(q1,ease(k)))}

/* ---------- globe input: tap picks the nearest glowing dot ---------- */
let drag=null,busy=false,cine=false,sel=null;
cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,m:0};cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",e=>{if(!drag||busy)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.m+=R.abs(dx)+R.abs(dy);drag.x=e.clientX;drag.y=e.clientY;
 globe.quaternion.premultiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(dy*.006,dx*.006,0)))});
cv.addEventListener("pointerup",e=>{if(drag&&drag.m<6&&!busy)tap(e);drag=null});
cv.addEventListener("wheel",e=>{if(!busy)camera.position.z=R.min(5,R.max(1.9,camera.position.z+e.deltaY*.002))},{passive:true});
function tap(e){const r=cv.getBoundingClientRect();let best=null,bd=28;
 dots.forEach(d=>{const w=globe.localToWorld(d.position.clone());if(w.dot(camera.position)<1)return;const s=w.project(camera),x=(s.x+1)/2*r.width+r.left,y=(1-s.y)/2*r.height+r.top,k=R.hypot(x-e.clientX,y-e.clientY);if(k<bd){bd=k;best=d.userData}});
 best?select(best):say("No one is there. Tap a glowing dot.")}
function select(p){sel=p;ring.position.copy(p.v).multiplyScalar(1.008);ring.quaternion.setFromUnitVectors(V(0,0,1),p.v);ring.visible=true;showInfo()}
function showInfo(){const p=sel,s=st(p),n=isNight(p);$("pn").textContent=p.name;$("pm").textContent="Age "+p.age+", "+p.job+", "+p.town+" ("+fmt(p.lat,p.lon)+")";$("pb").textContent=p.bio;
 $("ps").textContent=s=="taken"?"Taken by "+S[p.id].tool+" on "+S[p.id].at+".":n?"It is dark there. The Reaper may act.":"Daylight there. The Reaper cannot act until night falls.";
 $("mk").hidden=s=="taken";$("mk").textContent=s=="marked"?"Unmark":"Mark";$("dr").hidden=s=="taken";$("dr").disabled=!n;$("rp").hidden=s!="taken";$("info").hidden=false}
$("ci").onclick=()=>{$("info").hidden=true;ring.visible=false;say(IDLE)};
$("mk").onclick=()=>{S[sel.id]=st(sel)=="marked"?undefined:{s:"marked"};if(!S[sel.id])delete S[sel.id];save();paint();renderList();showInfo()};
$("rp").onclick=()=>{$("info").hidden=true;playFate(sel,S[sel.id].key)};

/* ---------- drawing pad + recognition (Claude reads the sketch; local fallback) ---------- */
const TOOLS={knife:"Knife",arrow:"Arrow",lightning:"Lightning",anvil:"Heavy block",meteor:"Meteor",curse:"Curse",fire:"Fire",poison:"Poison"};
const PHR={knife:"the Reaper’s blade",arrow:"an arrow from the dark",lightning:"a bolt from a clear sky",anvil:"a heavy block falling from the dark",meteor:"a falling star",curse:"a spiral curse",fire:"sudden flames",poison:"a creeping green mist"};
let forced=null,strokes=[],ds=null,goBusy=false;
const dc=$("dc"),dx=dc.getContext("2d"),hyp=(a,b)=>R.hypot(a[0]-b[0],a[1]-b[1]);
const xy=e=>{const r=dc.getBoundingClientRect();return[(e.clientX-r.left)/r.width*2-1,1-(e.clientY-r.top)/r.height*2]};
dc.onpointerdown=e=>{dc.setPointerCapture(e.pointerId);ds=[xy(e)];strokes.push(ds);forced=null;shelf();redraw()};
dc.onpointermove=e=>{if(!ds)return;const q=xy(e),l=ds[ds.length-1];if(hyp(q,l)>.015){ds.push(q);redraw()}};dc.onpointerup=dc.onpointercancel=()=>{ds=null};
function redraw(){const W=dc.width;dx.shadowBlur=0;dx.clearRect(0,0,W,W);dx.strokeStyle="rgba(120,80,170,.4)";dx.lineWidth=1;dx.beginPath();dx.arc(W/2,W/2,W*.48,0,PI*2);dx.stroke();
 dx.lineCap=dx.lineJoin="round";dx.lineWidth=5;dx.strokeStyle="#efe6d2";dx.shadowColor="#e0587a";dx.shadowBlur=10;
 strokes.forEach(s=>{dx.beginPath();s.forEach((q,i)=>{const x=(q[0]+1)/2*W,y=(1-q[1])/2*W;i?dx.lineTo(x,y):dx.moveTo(x,y)});dx.stroke()})}
function shelf(){const s=$("shelf");s.innerHTML="";Object.keys(TOOLS).forEach(k=>{const b=document.createElement("button");b.textContent=TOOLS[k];b.className=forced==k?"on":"";b.onclick=()=>{forced=k;strokes=[];redraw();$("perr").textContent="";shelf()};s.append(b)})}
function rs(s,n){let L=0;const d=[0];for(let i=1;i<s.length;i++){L+=hyp(s[i],s[i-1]);d.push(L)}const o=[];let j=1;
 for(let i=0;i<n;i++){const t=L*i/(n-1);while(j<s.length-1&&d[j]<t)j++;const a=s[j-1],b=s[j],u=(t-d[j-1])/((d[j]-d[j-1])||1);o.push([a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u])}return{o,L}}
function classify(ss){const A=ss.filter(s=>s.length>2);if(!A.length)return null;if(A.length>=3)return"anvil";if(A.length==2)return"knife";
 const{o,L}=rs(A[0],20);if(L<.3)return null;const ch=hyp(o[0],o[19]);let c=0;
 for(let i=1;i<19;i++){const a=[o[i][0]-o[i-1][0],o[i][1]-o[i-1][1]],b=[o[i+1][0]-o[i][0],o[i+1][1]-o[i][1]],m=R.hypot(...a)*R.hypot(...b);if(m&&R.acos(R.max(-1,R.min(1,(a[0]*b[0]+a[1]*b[1])/m)))>1){c++;i++}}
